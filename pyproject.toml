[project]
name = "smolagents-access-log"
version = "0.1.0"
description = "Working companion code for the smolagents article on codewithkyryl.dev — a CodeAgent that analyzes API access logs"
requires-python = ">=3.11"
dependencies = [
    "smolagents>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
